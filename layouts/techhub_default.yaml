# TechHub Trial layout (surveyed 2026-10-29, #44), used by the spatial
# simulator (gateway/sim.py, #25) and the evaluation harness.
#
# Room: the 1200 x 600 cm trial area, 60 cm floor tiles (20 x 10). The
# Anchors and the Beacon all sit on 77 cm tables, so the geometry is 2-D.
#
# Coordinates are metres; origin (0, 0) is A4's corner, x runs along the
# 1200 cm side, y along the 600 cm side. The team's whiteboard sketch uses
# the other axis names: its X runs along the 600 cm side and its y along the
# 1200 cm side, also from A4. So repo (x, y) = whiteboard (y, X).

room:
  width_m: 12.0
  height_m: 6.0

# Anchors A1..A4 at the four room corners, clockwise from A1.
anchors:
  A1: [0.0, 6.0]
  A2: [12.0, 6.0]
  A3: [12.0, 0.0]
  A4: [0.0, 0.0]

# Reference points of the TechHub Calibration session (ADR-0003), listed
# instead of generated because the session's grid and naming are fixed by
# what was measured: a 1.2 m lattice (every second tile line), 11 x 6 = 66
# corners less the four Anchor corners = 62 points. Names follow the walk
# order: p1 next to A1, each row runs A1 -> A2, then one row toward A4.
# The order was confirmed against RSSI vs distance (r = -0.78).
#
#   y\x 0.0  1.2  2.4  3.6  4.8  6.0  7.2  8.4  9.6 10.8 12.0
#   6.0  A1   p1   p2   p3   p4   p5   p6   p7   p8   p9   A2
#   4.8 p10  p11  p12  p13  p14  p15  p16  p17  p18  p19  p20
#   3.6 p21  p22  p23  p24  p25  p26  p27  p28  p29  p30  p31
#   2.4 p32  p33  p34  p35  p36  p37  p38  p39  p40  p41  p42
#   1.2 p43  p44  p45  p46  p47  p48  p49  p50  p51  p52  p53
#   0.0  A4  p54  p55  p56  p57  p58  p59  p60  p61  p62   A3
reference_points:
  p1: [1.2, 6.0]
  p2: [2.4, 6.0]
  p3: [3.6, 6.0]
  p4: [4.8, 6.0]
  p5: [6.0, 6.0]
  p6: [7.2, 6.0]
  p7: [8.4, 6.0]
  p8: [9.6, 6.0]
  p9: [10.8, 6.0]
  p10: [0.0, 4.8]
