# Held-out Test positions P1..P10 (ADR-0003). PLACEHOLDERS until the
# Test-position day is planned: they sit at 1.2 m cell centres, so each is
# 0.85 m from every Reference point (the loader rejects < 0.3 m), and
# >= 0.6 m from every internal zone edge.
test_positions:
  P1: [1.8, 0.6]
  P2: [6.6, 0.6]
  P3: [10.2, 0.6]
  P4: [3.0, 1.8]
  P5: [5.4, 1.8]
  P6: [9.0, 1.8]
  P7: [1.8, 4.2]
  P8: [5.4, 4.2]
  P9: [9.0, 4.2]
  P10: [10.2, 5.4]

# Coarse zones for the zone-accuracy metric (ADR-0003: >= ~90 % target).
# Rectangles [x0, y0, x1, y1] that must tile the room exactly; a point on a
# shared edge belongs to the zone with the larger coordinate. Every Test
# position must be >= 0.3 m from an internal zone edge (else its zone hit
# is a coin flip); the loader enforces it. PLACEHOLDER 3 x 2 split of the
# 12 x 6 m room; redraw to match TechHub's areas.
zones:
  Z1: [0.0, 0.0, 4.0, 3.0]
  Z2: [4.0, 0.0, 8.0, 3.0]
  Z3: [8.0, 0.0, 12.0, 3.0]
  Z4: [0.0, 3.0, 4.0, 6.0]
  Z5: [4.0, 3.0, 8.0, 6.0]
  Z6: [8.0, 3.0, 12.0, 6.0]

# Transmitters. mode: steady (fixed rate_hz, the Beacon) or sporadic
# (ambient IoT: Poisson bursts averaging rate_hz packets/s overall,
# burst_mean packets per burst). Per-device nuisance makes two devices at the
# same spot look different (drives the cross-device Trial, ADR-0003):
#   tx_offset_db  added to every RSSI reading
#   gain          multiplies CSI amplitudes (removed by L2 normalization)
#   tilt          linear spectral tilt, amplitude units per subcarrier
#                 (D-CFR turns it into a constant; ADR-0002)
devices:
  beacon:
    role: beacon
    mac: "68:fe:71:fa:df:fc"   # the TechHub Beacon
    mode: steady
    rate_hz: 20.0
    tx_offset_db: 0.0
    gain: 1.0
    tilt: 0.0
  phone:
    role: target            # the cross-device Trial's transmitter
    mac: "3c:22:fb:aa:10:07"
    mode: steady
    rate_hz: 20.0
    tx_offset_db: -4.0
    gain: 0.8
    tilt: 0.4
  plug:
    role: ambient           # present in every Trial at a fixed spot
    mac: "d8:f1:5b:21:7c:3a"
    mode: sporadic
    rate_hz: 0.1
    burst_mean: 3
    position: [9.75, 4.5]
    tx_offset_db: -2.0
    gain: 1.1
    tilt: -0.2
  camera:
    role: ambient
    mac: "7c:a7:b0:4e:02:91"
    mode: sporadic
    rate_hz: 0.1
    burst_mean: 3
    position: [2.25, 4.0]
    tx_offset_db: 2.0
    gain: 0.9
    tilt: 0.3

# Physics defaults (ADR-0002). A characterization noise JSON (--noise) may
# override any of these keys; see gateway/sim.py.
physics:
  rssi_at_1m_dbm: -40.0       # P0 of the log-distance model
  path_loss_exponent: 2.7     # n
  rssi_shadowing_db: 3.0      # log-normal shadowing sd, fixed per (Anchor, position)
  rssi_jitter_db: 2.0         # per-packet RSSI noise sd
  sensitivity_dbm: -95.0      # packets weaker than this are not received
  wall_reflection: 0.8        # amplitude reflection coefficient of every wall
  reflection_order: 4         # image sources up to this many wall bounces
  phase_wavelength_m: 8.0     # effective wavelength of each path's phase
                              # (smooth fingerprints at ~1 m grid scale)
  csi_mean_amplitude: 30.0    # per-frame auto-scaled CSI level (manu_scale = false)
  csi_noise: 0.8              # per-packet CSI amplitude noise sd
