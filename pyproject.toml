[project]
name = "gateway"
version = "0.1.0"
description = "Gateway preprocessing pipeline for the hybrid RSSI-CSI localization thesis"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pandas>=1.4", "pyarrow>=8"]
capture = ["pyserial>=3.5"]   # serial-link listeners under scripts/
viz = ["matplotlib>=3.7"]     # scripts/live_csi_dashboard.py
scout = ["torch>=2.2"]     # gateway/scout.py, the MDN Scout (CPU is enough)
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import tests.conftest helpers
